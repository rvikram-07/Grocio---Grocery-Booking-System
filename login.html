<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to Grocio</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="container auth-wrap"><section class="auth-card"><div class="auth-brand"><span class="brand-mark">✿</span><h1>Good to see you.</h1><p class="muted">Your fresh finds are just a few taps away.</p></div><div class="auth-tabs" role="tablist"><button class="auth-tab active" id="tab-login" data-testid="tab-login" role="tab" aria-selected="true">Login</button><button class="auth-tab" id="tab-signup" data-testid="tab-signup" role="tab" aria-selected="false">Create account</button></div><form id="auth-form" novalidate><div id="signup-name-wrap" class="field hidden"><label for="auth-name">Full name</label><input id="auth-name" data-testid="login-name" autocomplete="name"><small class="field-error" id="error-name"></small></div><div class="field"><label for="auth-email">Email address</label><input id="auth-email" data-testid="login-email" type="email" autocomplete="email" placeholder="you@example.com"><small class="field-error" id="error-email"></small></div><div class="field"><label for="auth-phone">10-digit phone number</label><input id="auth-phone" data-testid="login-phone" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="9876543210"><small class="field-error" id="error-phone"></small></div><div class="field"><label for="auth-password">Password</label><div class="password-wrap"><input id="auth-password" data-testid="login-password" type="password" autocomplete="current-password" placeholder="At least 8 characters"><button type="button" id="toggle-password" data-testid="toggle-password" class="password-toggle" aria-label="Show password">Show</button></div><small class="field-error" id="error-password"></small></div><button class="btn btn-primary btn-wide" id="login-submit" data-testid="login-submit" type="submit">Continue</button><p class="fine-print">Demo only: use any valid-looking details. No account is created on a server.</p></form></section></main><div id="site-footer"></div><div id="cart-drawer-root"></div><div id="toast-root" aria-live="polite"></div><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
