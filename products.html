<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop groceries | Grocio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="container listing-layout"><aside class="category-sidebar"><h2>Categories</h2><nav id="side-categories" aria-label="Product categories"></nav></aside><section class="listing-main"><div class="listing-heading"><div><p class="eyebrow">Your neighbourhood basket</p><h1 id="listing-title">All groceries</h1><p id="result-count" class="muted"></p></div><div class="toolbar"><label>Sort <select id="sort-select" data-testid="sort-select"><option value="relevance">Relevance</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="discount">Discount</option></select></label><label class="stock-filter"><input type="checkbox" id="stock-only" data-testid="stock-only"> In stock only</label></div></div><div class="price-filter"><label for="price-range">Maximum price: <strong id="price-value">₹1000</strong></label><input id="price-range" data-testid="price-range" type="range" min="20" max="1000" step="10" value="1000"></div><div id="product-grid" class="product-grid"></div><div id="empty-state" class="empty-state hidden"><div>🧺</div><h2>No products found</h2><p>Try a different search or browse another category.</p><a class="btn btn-primary" href="products.html">Browse all groceries</a></div></section></main><div id="product-modal-root"></div><div id="site-footer"></div><div id="cart-drawer-root"></div><div id="toast-root" aria-live="polite"></div><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/products.js"></script></body></html>
